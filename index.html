<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXUM TRADE SNIPER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-white font-sans text-center p-6">
    
    <!-- LOADING SCREEN -->
    <div id="loadingView">
        <h1 class="text-2xl font-black text-blue-400 mb-2">Checking Access...</h1>
        <p class="text-gray-400">Verifying your Telegram account.</p>
    </div>

    <!-- LOCKED SCREEN (Shows if they didn't pay) -->
    <div id="lockedView" class="hidden space-y-4">
        <h1 class="text-3xl font-black text-red-500">Access Denied 🚫</h1>
        <p class="text-gray-300">You do not have an active VIP subscription.</p>
        <p class="text-sm text-gray-400">Please go back to the Telegram Bot and pay 200 ETB via Telebirr to unlock the dashboard.</p>
    </div>

    <!-- DASHBOARD (Only shows if they paid) -->
    <div id="dashboardView" class="hidden w-full max-w-4xl space-y-4 text-left">
        <div class="bg-gray-800 p-4 rounded-xl flex justify-between items-center">
            <div>
                <h2 class="font-bold text-lg text-white">AXUM TRADE</h2>
                <p class="text-xs text-green-400">VIP Active</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">Live Price</p>
                <p id="livePrice" class="font-mono font-bold text-xl">--</p>
            </div>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <p class="text-xs text-gray-400 uppercase">Signal Engine</p>
            <div id="signalResult" class="text-2xl font-black text-gray-500">SCANNING...</div>
            <p id="aiReasoning" class="text-sm text-gray-400 mt-2">Waiting for data...</p>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function checkAccess() {
            // If running in Telegram, get the ID. If testing in browser, use your ID.
            const userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 7480888438; 
            
            try {
                const res = await fetch('/check-access/' + userId);
                const data = await res.json();
                
                document.getElementById('loadingView').classList.add('hidden');
                
                if (data.access) {
                    // User paid! Show dashboard.
                    document.getElementById('dashboardView').classList.remove('hidden');
                    startLiveUpdates();
                } else {
                    // User didn't pay. Show locked screen.
                    document.getElementById('lockedView').classList.remove('hidden');
                }
            } catch(e) {
                document.getElementById('loadingView').innerHTML = "<p class='text-red-500'>Server Error. Try again.</p>";
            }
        }

        async function startLiveUpdates() {
            // Your live price/signal update logic goes here
            setInterval(async () => {
                // Just a demo of price updating
                document.getElementById('livePrice').innerText = (1.32 + Math.random()*0.01).toFixed(5);
            }, 5000);
        }

        // Run check as soon as Mini App opens
        checkAccess();
    </script>
</body>
</html>
