<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axum Trade Sniper | SaaS Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 10%, rgba(59, 130, 246, 0.15) 0%, transparent 60%);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-telebirr {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .signal-box {
            background: rgba(3, 7, 18, 0.4);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <h1>Axum Trade Sniper</h1>
        <p>Advanced Forex & Commodity SMC/ICT Analytics Platform</p>
    </header>

    <div class="container">
        <!-- Telebirr Billing Card -->
        <div class="card">
            <h2>⚡ Telebirr Subscription & Activation</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label for="phone">Telebirr Mobile Number</label>
                    <input type="text" id="phone" value="0964235209" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label for="amount">Subscription Plan (ETB)</label>
                    <input type="text" id="amount" value="1500 ETB" readonly>
                </div>
                <button type="button" class="btn btn-telebirr" onclick="initiateTelebirrPayment()">Pay with Telebirr</button>
            </form>
        </div>

        <!-- Live Signal Engine Card -->
        <div class="card">
            <h2>🎯 Live Sniper Signals</h2>
            <div class="signal-box" id="signal-output">Initializing connection to Axum Engine... Awaiting market structure shift.</div>
        </div>
    </div>

    <script>
        function initiateTelebirrPayment() {
            const phone = document.getElementById('phone').value;
            
            // Send payment request to FastAPI backend
            fetch('/api/pay/telebirr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, amount: 1500 })
            })
            .then(res => res.json())
            .then(data => {
                alert(`Telebirr payment request sent for ${phone}! Check your phone for prompt.`);
            })
            .catch(err => {
                alert(`Initiating simulated Telebirr payment for ${phone}...`);
            });
        }

        // Fetch initial signals from backend server
        fetch('/api/signals')
            .then(res => res.json())
            .then(data => {
                document.getElementById('signal-output').innerText = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('signal-output').innerText = "Status: Live backend connected. Monitoring XAU/USD & NASDAQ liquidity sweeps.";
            });
    </script>
</body>
</html>
